name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/about/index.html
          grep -q '/SPCG/_next/' out/index.html
          grep -q '/SPCG/images/' out/index.html

      - name: Sync to docs/ (branch deploy /docs)
        run: |
          rm -rf docs/*
          cp -a out/. docs/
          touch docs/.nojekyll

      - name: Sync to repo root (branch deploy / root)
        run: bash scripts/sync-pages-root.sh

      - name: Publish gh-pages branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Commit and push static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ .nojekyll scripts/sync-pages-root.sh
          while IFS= read -r path; do
            git add -f "$path"
          done <<EOF
          index.html
          404.html
          404
          about
          _next
          _not-found
          images
          favicon.ico
          branding-reference.png
          file.svg
          globe.svg
          next.svg
          vercel.svg
          window.svg
          EOF
          git add -f __next.*.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No deploy file changes"
          else
            git commit -m "chore(pages): publish static site to docs/ and root"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
